name: clean-install

on:
  push:
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      with_hermes:
        description: "Instalar também o Hermes upstream (lento)"
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -x -s sh bootstrap.sh install.sh test/docker-ubuntu.sh
          shellcheck -s bash kernel/compose/knowledge/entrypoint.sh
      - name: uv (versão do lockfile)
        run: |
          . kernel/versions.env
          curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | env UV_INSTALL_DIR="$HOME/.local/bin" UV_NO_MODIFY_PATH=1 sh
      - name: lint de privacidade
        run: |
          "$HOME/.local/bin/uv" run --quiet kernel/bin/privacy_lint.py
      - name: lint de idiomas (toda frase de T() tem tradução)
        run: |
          "$HOME/.local/bin/uv" run --quiet kernel/bin/i18n_lint.py
      - name: esquema e tenant de exemplo (dry-run, três papéis)
        run: ./bootstrap.sh --tenant tenants/example/jarvis.yaml --role desktop,core,knowledge --dry-run
      - name: add-on de exemplo (dry-run)
        run: ./bootstrap.sh --tenant tenants/example/jarvis.yaml --role desktop,core,knowledge --dry-run --addon tenants/example/addon-example/addon.yaml
      - name: testes do mecanismo de add-on (A1 a A10)
        run: PATH="$HOME/.local/bin:$PATH" python3 test/test_addon.py
      - name: plugins do Hermes trazidos por add-on (HP1 a HP8)
        run: PATH="$HOME/.local/bin:$PATH" python3 test/test_hermes_plugins.py
      - name: testes da migração para a 0.4.0 (nomes em inglês)
        run: PATH="$HOME/.local/bin:$PATH" python3 test/test_migrate_0_4.py
      - name: quem pensa (status rápido com o Hermes lento)
        run: python3 test/test_thinker.py
      - name: assistente (conversas encerradas quando skills ou MCPs mudam)
        run: PATH="$HOME/.local/bin:$PATH" python3 test/test_assistant_sessions.py

  install:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            roles: desktop,core,knowledge
          - os: macos-latest
            roles: desktop,core
    runs-on: ${{ matrix.os }}
    env:
      # as conferências abaixo comparam textos em português; o padrão do kernel (sem a variável) é inglês
      JARVIS_LANGUAGE: pt-BR
    steps:
      - uses: actions/checkout@v4
      - name: instalação zerada (${{ matrix.roles }}, sem subir serviços)
        env:
          GH_TOKEN: ${{ github.token }} # permite ao bootstrap baixar o FFmpeg com whisper da release privada
        run: ./bootstrap.sh --tenant tenants/example/jarvis.yaml --role ${{ matrix.roles }} --no-start --no-prompt ${{ inputs.with_hermes && '--with-hermes --skip web' || '--skip hermes,web' }}
      - name: verificação comum
        run: |
          . "$HOME/.jarvis/profile.sh"
          test "$JARVIS_TENANT" = example
          test "$JARVIS_DATA" = "$HOME/.example"
          test -d "$JARVIS_DATA"
          node -v | grep -q '^v24.22.2$'
          uv --version
          claude --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          if [ "$(uname -s)" = Linux ]; then ffmpeg -hide_banner -filters | grep -q whisper; fi
          test -L "$HOME/.claude/skills/example-hello"
          test -f "$HOME/.jarvis/skills/example-hello/SKILL.md"
          perm=$(stat -c %a "$HOME/.jarvis/secrets.env" 2>/dev/null || stat -f %Lp "$HOME/.jarvis/secrets.env")
          test "$perm" = 600
          claude mcp get example_tools
          paperclipai -V
          test -f "$HOME/.jarvis/render/hermes/env"
          cat "$HOME/.jarvis/render/summary.txt"
      - name: configuração depois da instalação (jarvis_setup.py e bootstrap --apply, como o JARVIS Web faz)
        run: |
          test "$(cat "$HOME/.jarvis/kernel.path")" = "$PWD"
          python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" status | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["ok"] and d["tenant"] == "example" and d["telegram"]["available"] and not d["done"], d
          names = {s["name"] for s in d["secrets"]}
          assert "EXAMPLE_TOKEN" in names and "TELEGRAM_BOT_TOKEN" not in names and "POSTGRES_PASSWORD" not in names, names'
          # assistentes do tenant de exemplo: catálogo, perfil renderizado por tipo e segredos com título
          python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" status | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          a = {x["name"]: x for x in d["assistants"]}
          assert set(a) == {"support", "example-client", "discord-example", "whatsapp-example"} and a["example-client"]["type"] == "client" and not a["support"]["token"], a
          assert a["whatsapp-example"]["channel"] == "whatsapp" and a["whatsapp-example"]["secrets"]["token"] is None and a["whatsapp-example"]["whatsapp"]["paired"] is False, a
          assert a["support"]["channel"] == "telegram" and a["discord-example"]["channel"] == "discord", a
          assert a["discord-example"]["secrets"]["token"] == "DISCORD_BOT_TOKEN_DISCORD_EXAMPLE", a
          titles = {s["name"]: s["title"] for s in d["secrets"]}
          assert titles.get("TELEGRAM_BOT_TOKEN_SUPPORT", "").startswith("Token do bot do assistente"), titles
          assert "DISCORD_BOT_TOKEN_DISCORD_EXAMPLE" in titles and "TELEGRAM_BOT_TOKEN_DISCORD_EXAMPLE" not in titles, titles'
          # o assistente do Discord rende as variáveis do Discord e nenhuma do Telegram
          grep -q "^DISCORD_BOT_TOKEN=" "$HOME/.jarvis/render/hermes/assistants/discord-example/env"
          grep -q "^DISCORD_REQUIRE_MENTION=true" "$HOME/.jarvis/render/hermes/assistants/discord-example/env"
          ! grep -q "TELEGRAM" "$HOME/.jarvis/render/hermes/assistants/discord-example/env"
          grep -q "discord:" "$HOME/.jarvis/render/hermes/assistants/discord-example/config.yaml"
          grep -q "^TELEGRAM_BOT_TOKEN=" "$HOME/.jarvis/render/hermes/assistants/support/env"
          # o assistente do WhatsApp: sem token, ponte desligada até parear, sessão e porta próprias
          grep -q "^WHATSAPP_ENABLED=false" "$HOME/.jarvis/render/hermes/assistants/whatsapp-example/env"
          grep -q "^WHATSAPP_MODE=bot" "$HOME/.jarvis/render/hermes/assistants/whatsapp-example/env"
          grep -q "session_path:.*assistants/whatsapp-example/whatsapp/session" "$HOME/.jarvis/render/hermes/assistants/whatsapp-example/config.yaml"
          ! grep -q "TELEGRAM\|DISCORD" "$HOME/.jarvis/render/hermes/assistants/whatsapp-example/env"
          test -f "$HOME/.jarvis/render/hermes/assistants/example-client/SOUL.md"
          grep -q "dm_policy: allowlist" "$HOME/.jarvis/render/hermes/assistants/example-client/config.yaml" && grep -q "unauthorized_dm_behavior: decline" "$HOME/.jarvis/render/hermes/assistants/example-client/config.yaml"
          ! grep -q "mcp_servers" "$HOME/.jarvis/render/hermes/assistants/example-client/config.yaml"
          # o Escritório do tenant de exemplo: cargo padrão + writer renderizados, rotina padrão + daily-status no catálogo
          python3 -c '
          import json
          d = json.load(open("'"$HOME"'/.jarvis/render/office.json"))
          assert d["enabled"] and [c["name"] for c in d["positions"]] == ["work", "writer"] and d["positions"][1]["does"], d
          assert [r["name"] for r in d["routines"]] == ["weekly-summary", "daily-status"] and d["routines"][1]["where"] == "assistant:support", d'
          grep -q "cargo Redator" "$HOME/.jarvis/render/hermes/positions/writer/SOUL.md"
          # quem pensa: claude · balanced no dono e nos cargos; o writer (level: capable) no modelo mais capaz
          grep -q "default: claude-sonnet-5-5" "$HOME/.jarvis/render/hermes/model.yaml"
          grep -q "default: claude-sonnet-5-5" "$HOME/.jarvis/render/hermes/positions/work/config.yaml"
          grep -q "default: claude-opus-5-5" "$HOME/.jarvis/render/hermes/positions/writer/config.yaml"
          python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" status | python3 -c '
          import json, sys
          p = json.load(sys.stdin)["thinker"]
          assert p["provider"] == "claude" and p["level"] == "balanced" and p["model"] == "claude-sonnet-5-5" and p["chosen"], p'
          echo "{\"level\":\"turbo\"}" | python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" thinker-set | grep -q "\"ok\": false"
          grep -q "office:" "$HOME/.jarvis/render/hermes/positions/writer/config.yaml"
          ! grep -q "terminal" "$HOME/.jarvis/render/hermes/positions/writer/config.yaml"
          python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" status | python3 -c '
          import json, sys
          e = json.load(sys.stdin)["office"]
          assert e["enabled"] and [c["name"] for c in e["positions"]] == ["work", "writer"], e
          r = {x["name"]: x for x in e["routines"]}
          assert r["daily-status"]["when_text"] == "de segunda a sexta às 08:30" and r["weekly-summary"]["default"], r'
          # o kernel responde no idioma da interface: este job roda em pt-BR (env do job); sem a variável, inglês
          env -u JARVIS_LANGUAGE python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" status | python3 -c '
          import json, sys
          r = {x["name"]: x for x in json.load(sys.stdin)["office"]["routines"]}
          assert r["daily-status"]["when_text"] == "Monday to Friday at 08:30", r'
          # rotina criada pela página: vale sem colocar em uso; agenda inválida é recusada
          echo "{\"name\":\"ping\",\"title\":\"Ping\",\"does\":\"Diga oi.\",\"when\":\"*/5 * * * *\",\"position\":\"writer\"}" | python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" office-routine-add | grep -q "\"ok\": true"
          echo "{\"name\":\"ruim\",\"title\":\"Ruim\",\"does\":\"x\",\"when\":\"99 * * * *\"}" | python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" office-routine-add | grep -q "\"ok\": false"
          python3 kernel/bin/jarvis_courier.py --home "$HOME/.jarvis" --dry-run | grep -q "rotina ping dispararia"
          grep -q "mcp_servers" "$HOME/.jarvis/render/hermes/assistants/support/config.yaml"
          printf 'valor-de-teste\n' | python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" set-secret EXAMPLE_TOKEN
          test "$(grep -c "^EXAMPLE_TOKEN='valor-de-teste'$" "$HOME/.jarvis/secrets.env")" = 1
          # só reaplica: nada instalado, serviço do JARVIS Web intocado; o segredo gravado sobrevive ao render
          ./bootstrap.sh --apply --skip hermes
          test "$(grep -c "^EXAMPLE_TOKEN='valor-de-teste'$" "$HOME/.jarvis/secrets.env")" = 1
          python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" done
          test -f "$HOME/.jarvis/setup.done"
          # atualização: consulta o GitHub (ramo da origem) e responde sem erro; nada em andamento
          python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" update-check --force | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["ok"] and d["error"] is None and d["remote"]["kernel"] and d["local"]["kernel"], d'
          python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" update-status | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["ok"] and not d["running"] and d["exit_code"] is None, d'
      - name: verificação do papel knowledge (compose sobe o banco e desce)
        if: contains(matrix.roles, 'knowledge')
        run: |
          d="$HOME/.jarvis/compose/knowledge"
          test -f "$d/.env"
          grep -q '^POSTGRES_PASSWORD=.' "$d/.env"
          docker compose --project-directory "$d" config -q
          docker compose --project-directory "$d" up -d db
          s=starting
          for i in $(seq 1 30); do
            s=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose --project-directory "$d" ps -q db)")
            [ "$s" = healthy ] && break
            sleep 2
          done
          test "$s" = healthy
          docker compose --project-directory "$d" down -v
      - name: exportar e importar (stores jarvis, data, paperclip, claude; HOME alternativo)
        run: |
          . "$HOME/.jarvis/profile.sh"
          echo "dado de exemplo" > "$JARVIS_DATA/readme.txt"
          uv run --quiet kernel/bin/wb_export.py --dry-run
          uv run --quiet kernel/bin/wb_export.py --out "$RUNNER_TEMP/bundle.tar.gz" --only jarvis,data,paperclip,claude
          test -f "$RUNNER_TEMP/bundle.tar.gz.sha256"
          uv run --quiet kernel/bin/wb_import.py "$RUNNER_TEMP/bundle.tar.gz" --dry-run
          uv run --quiet kernel/bin/wb_import.py "$RUNNER_TEMP/bundle.tar.gz" --jarvis-home "$RUNNER_TEMP/jarvis2" --paperclip-home "$RUNNER_TEMP/pc2" --data-home "$RUNNER_TEMP/data2" --only jarvis,data,paperclip
          test -f "$RUNNER_TEMP/jarvis2/jarvis.yaml"
          test -f "$RUNNER_TEMP/jarvis2/skills/example-hello/SKILL.md"
          test ! -f "$RUNNER_TEMP/jarvis2/secrets.env"
          test -f "$RUNNER_TEMP/data2/readme.txt"
      - name: idempotência (segunda execução)
        run: ./bootstrap.sh --tenant tenants/example/jarvis.yaml --role ${{ matrix.roles }} --no-start --no-prompt --skip hermes,web
      - name: "instalador de uma linha (modo curl | sh, clona e roda o bootstrap)"
        env:
          WHITEBEARD_OS_DIR: ${{ runner.temp }}/whitebeard-os-oneline
          WHITEBEARD_OS_REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # em PR, ref_name é "N/merge" (ref interno, não é branch): usa o branch de origem
          WHITEBEARD_OS_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          cat install.sh | sh -s -- --no-start --no-prompt --skip hermes,web
          test -f "$WHITEBEARD_OS_DIR/bootstrap.sh"
          test "$(cat "$HOME/.jarvis/tenant.path")" = "$WHITEBEARD_OS_DIR/tenants/personal/jarvis.yaml"  # tenant padrão do install.sh
