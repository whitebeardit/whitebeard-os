# Tenant de exemplo, fictício. Valida o instalador sem dado real e serve de ponto de partida:
# copie esta pasta para um repositório privado seu e troque os valores.
tenant: exemplo
idioma: pt-BR
aceleracao: auto # GPU se houver (CUDA, Metal, Vulkan); CPU sempre funciona
dados: .exemplo # pasta de dados do tenant, relativa a $HOME (vira $JARVIS_DATA; padrão: $JARVIS_HOME/data)
interface:
  modulos: [sistemas, conhecimento, arquivos, comunicacoes, ferramentas, diagnosticos, camera, operacao] # os genéricos; instagram, midias, rastreamento, leads, analytics são integrações

vault:
  path: whitebeard-secondbrain # relativo a $HOME; sem repo:, o instalador cria um second brain local aqui
  # repo: git@github.com:sua-org/second-brain.git   # opcional: um vault já existente, para clonar

mcp:
  # o cérebro local (GBrain do papel knowledge) entra sozinho como MCP `knowledge`; declare aqui só os extras
  - name: exemplo_ferramentas
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-everything"]
    env:
      EXEMPLO_TOKEN: "${EXEMPLO_TOKEN}"
    roles: [desktop]

skills:
  packs:
    - skills # relativo a este arquivo

# Plugins do Claude Code que o tenant usa (papel desktop). O bootstrap registra o marketplace e instala o
# plugin se faltarem; o uninstall desinstala só o que ele instalou. O exemplo não precisa de nenhum.
# claude:
#   marketplaces: [whitebeardit/claude-plugins]
#   plugins: [sherlock-holmes@whitebeard-plugins]   # usado pelo módulo rastreamento

# Camada de decisão (rotear, classificar, guardrails). `regras` e `llm` não dependem de terceiros;
# `jev` usa a API da TypeSafe AI e exige TYPESAFE_API_KEY em secrets.env.
decisoes:
  provider: regras
  limiar_confianca: 0.85
  perfis_excluidos: [cliente-exemplo] # conteúdo desses perfis nunca sai para provedor externo

segredos:
  - name: EXEMPLO_TOKEN
    title: Token de exemplo
    description: Token fictício; mostra como um tenant declara os próprios segredos (title é o nome que a pessoa lê).
    required: false
    obtain: não existe; deixe vazio

hermes:
  provider: anthropic
  model: claude-sonnet-5-5
  fallback: anthropic/claude-haiku-5-5

telegram:
  bot: "@exemplo_bot"
  home_chat: "${TELEGRAM_HOME_CHANNEL}"

perfis:
  - nome: cliente-exemplo
    tipo: grupo-cliente
    chat_id: "${EXEMPLO_CLIENTE_CHAT_ID}"
    skills: [exemplo-ola]

crons:
  - nome: diario
    agenda: "30 23 * * *"
    prompt: "Resuma o dia e registre no vault."

servicos_monitorados: []

# Onde cada papel roda. Padrão do produto: tudo-em-um (os três papéis no mesmo host).
# Para dividir, declare outros hosts, ex.: {host: servidor, papeis: [core, knowledge]}.
nos:
  - host: local
    papeis: [desktop, core, knowledge]
