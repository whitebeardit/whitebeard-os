# Manifesto de segredos do kernel. Só nomes, título humano, papéis, descrição e como obter. NUNCA valores.
# `title` é o que a pessoa lê na página PRIMEIROS PASSOS; `description` diz quando preencher, em linguagem comum.
# O tenant declara os seus em `segredos:` no jarvis.yaml. Variáveis usadas como ${NOME} no yaml e não
# declaradas entram em secrets.env automaticamente (não obrigatórias) para ficarem visíveis.
version: 1
secrets:
  - name: ANTHROPIC_API_KEY
    title: Chave da Anthropic (Claude)
    description: Só se quiser usar o Claude por chave em vez do seu login. Vazia, o JARVIS usa a sua conta Claude.
    roles: [desktop, core, satelite]
    required: false
    obtain: console.anthropic.com → API keys
  - name: OPENAI_API_KEY
    title: Chave da OpenAI
    description: Só se o seu pacote usar modelos da OpenAI por chave. Vazia, essa parte fica desligada.
    roles: [desktop, core, satelite]
    required: false
    obtain: platform.openai.com → API keys
  - name: TYPESAFE_API_KEY
    title: Chave do Jev (TypeSafe AI)
    description: Só se o seu pacote usar o Jev na camada de decisão. Vazia, a decisão usa regras ou o modelo.
    roles: [desktop, core, satelite]
    required: false
    obtain: console.typesafe.ai → API keys
  - name: PAPERCLIP_URL
    title: Endereço do Paperclip
    description: Onde o Paperclip roda, quando está em outro computador (ex. http://core.local:3100). No tudo-em-um fica vazio.
    roles: [desktop, satelite]
    required: false
    obtain: endereço do host core na rede local
  - name: PAPERCLIP_API_KEY
    title: Chave do Paperclip
    description: Chave de API do Paperclip, para o painel e as ferramentas falarem com ele.
    roles: [desktop, core, satelite]
    required: false
    obtain: Paperclip → Settings → API keys, no nó core
  - name: TELEGRAM_BOT_TOKEN
    title: Token do bot do Telegram
    description: Token do seu bot (do @BotFather). Um bot responde em um só computador por vez.
    roles: [core]
    required: false
    obtain: "@BotFather no Telegram (opcional; ./install.sh --telegram pede e configura)"
  - name: TELEGRAM_HOME_CHANNEL
    title: Sua conversa no Telegram
    description: Identificação da sua conversa com o bot (um número, reconhecido sozinho na primeira mensagem).
    roles: [core]
    required: false
    obtain: reconhecido sozinho pelo ./install.sh --telegram na primeira mensagem ao bot
  - name: POSTGRES_PASSWORD
    title: Senha do banco do conhecimento
    description: Senha do banco (Postgres) do papel knowledge. Gerada na instalação se vazia.
    roles: [knowledge]
    required: true
    generate: true
    obtain: gerada automaticamente pelo bootstrap
  - name: GBRAIN_MCP_TOKEN
    title: Chave do cérebro (GBrain)
    description: Chave do cérebro local, usada pelo Claude Code e pelo Hermes. Criada pelo instalador; não precisa preencher.
    roles: [knowledge]
    required: false
    obtain: gerado pelo instalador (gbrain auth create); não precisa preencher
  - name: GBRAIN_ADMIN_BOOTSTRAP_TOKEN
    title: Chave de administração do cérebro
    description: Chave de administração do GBrain. Gerada na instalação se vazia; usada uma vez para criar o administrador.
    roles: [knowledge]
    required: true
    generate: true
    obtain: gerado automaticamente pelo bootstrap

# Autenticações que não cabem em variável: feitas uma vez por máquina, de forma interativa.
interactive:
  - name: claude-login
    description: O primeiro `claude` abre login OAuth da Anthropic (ou usa ANTHROPIC_API_KEY).
    roles: [desktop, core, satelite]
  - name: mcp-oauth
    description: Servidores MCP com OAuth autenticam uma vez por máquina com `/mcp` dentro do Claude Code.
    roles: [desktop, core, satelite]
  - name: hermes-provider
    description: Provedores com OAuth no Hermes (ex. openai-codex) autenticam uma vez pelo próprio Hermes.
    roles: [desktop, core, satelite]
