name: instalacao-zerada

on:
  push:
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      with_hermes:
        description: "Instalar também o Hermes upstream (lento)"
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -x -s sh bootstrap.sh install.sh test/docker-ubuntu.sh
          shellcheck -s bash kernel/compose/knowledge/entrypoint.sh
      - name: uv (versão do lockfile)
        run: |
          . kernel/versions.env
          curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | env UV_INSTALL_DIR="$HOME/.local/bin" UV_NO_MODIFY_PATH=1 sh
      - name: lint de privacidade
        run: |
          "$HOME/.local/bin/uv" run --quiet kernel/bin/privacy_lint.py
      - name: esquema e tenant de exemplo (dry-run, três papéis)
        run: ./bootstrap.sh --tenant tenants/exemplo/jarvis.yaml --role desktop,core,knowledge --dry-run

  instala:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            roles: desktop,core,knowledge
          - os: macos-latest
            roles: desktop,core
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: instalação zerada (${{ matrix.roles }}, sem subir serviços)
        env:
          GH_TOKEN: ${{ github.token }} # permite ao bootstrap baixar o FFmpeg com whisper da release privada
        run: ./bootstrap.sh --tenant tenants/exemplo/jarvis.yaml --role ${{ matrix.roles }} --no-start --no-prompt ${{ inputs.with_hermes && '--with-hermes --skip web' || '--skip hermes,web' }}
      - name: verificação comum
        run: |
          . "$HOME/.jarvis/profile.sh"
          test "$JARVIS_TENANT" = exemplo
          test "$JARVIS_DATA" = "$HOME/.exemplo"
          test -d "$JARVIS_DATA"
          node -v | grep -q '^v24.22.2$'
          uv --version
          claude --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          if [ "$(uname -s)" = Linux ]; then ffmpeg -hide_banner -filters | grep -q whisper; fi
          test -L "$HOME/.claude/skills/exemplo-ola"
          test -f "$HOME/.jarvis/skills/exemplo-ola/SKILL.md"
          perm=$(stat -c %a "$HOME/.jarvis/secrets.env" 2>/dev/null || stat -f %Lp "$HOME/.jarvis/secrets.env")
          test "$perm" = 600
          claude mcp get exemplo_ferramentas
          paperclipai -V
          test -f "$HOME/.jarvis/render/hermes/env"
          cat "$HOME/.jarvis/render/summary.txt"
      - name: configuração depois da instalação (jarvis_setup.py e bootstrap --apply, como o JARVIS Web faz)
        run: |
          test "$(cat "$HOME/.jarvis/kernel.path")" = "$PWD"
          python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" status | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["ok"] and d["tenant"] == "exemplo" and d["telegram"]["disponivel"] and not d["concluido"], d
          nomes = {s["nome"] for s in d["segredos"]}
          assert "EXEMPLO_TOKEN" in nomes and "TELEGRAM_BOT_TOKEN" not in nomes and "POSTGRES_PASSWORD" not in nomes, nomes'
          # assistentes do tenant de exemplo: catálogo, perfil renderizado por tipo e segredos com título
          python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" status | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          a = {x["nome"]: x for x in d["assistentes"]}
          assert set(a) == {"suporte", "cliente-exemplo", "discord-exemplo", "zap-exemplo"} and a["cliente-exemplo"]["tipo"] == "cliente" and not a["suporte"]["token"], a
          assert a["zap-exemplo"]["canal"] == "whatsapp" and a["zap-exemplo"]["segredos"]["token"] is None and a["zap-exemplo"]["whatsapp"]["pareado"] is False, a
          assert a["suporte"]["canal"] == "telegram" and a["discord-exemplo"]["canal"] == "discord", a
          assert a["discord-exemplo"]["segredos"]["token"] == "DISCORD_BOT_TOKEN_DISCORD_EXEMPLO", a
          titulos = {s["nome"]: s["titulo"] for s in d["segredos"]}
          assert titulos.get("TELEGRAM_BOT_TOKEN_SUPORTE", "").startswith("Token do bot do assistente"), titulos
          assert "DISCORD_BOT_TOKEN_DISCORD_EXEMPLO" in titulos and "TELEGRAM_BOT_TOKEN_DISCORD_EXEMPLO" not in titulos, titulos'
          # o assistente do Discord rende as variáveis do Discord e nenhuma do Telegram
          grep -q "^DISCORD_BOT_TOKEN=" "$HOME/.jarvis/render/hermes/assistentes/discord-exemplo/env"
          grep -q "^DISCORD_REQUIRE_MENTION=true" "$HOME/.jarvis/render/hermes/assistentes/discord-exemplo/env"
          ! grep -q "TELEGRAM" "$HOME/.jarvis/render/hermes/assistentes/discord-exemplo/env"
          grep -q "discord:" "$HOME/.jarvis/render/hermes/assistentes/discord-exemplo/config.yaml"
          grep -q "^TELEGRAM_BOT_TOKEN=" "$HOME/.jarvis/render/hermes/assistentes/suporte/env"
          # o assistente do WhatsApp: sem token, ponte desligada até parear, sessão e porta próprias
          grep -q "^WHATSAPP_ENABLED=false" "$HOME/.jarvis/render/hermes/assistentes/zap-exemplo/env"
          grep -q "^WHATSAPP_MODE=bot" "$HOME/.jarvis/render/hermes/assistentes/zap-exemplo/env"
          grep -q "session_path:.*assistentes/zap-exemplo/whatsapp/session" "$HOME/.jarvis/render/hermes/assistentes/zap-exemplo/config.yaml"
          ! grep -q "TELEGRAM\|DISCORD" "$HOME/.jarvis/render/hermes/assistentes/zap-exemplo/env"
          test -f "$HOME/.jarvis/render/hermes/assistentes/cliente-exemplo/SOUL.md"
          grep -q "dm_policy: allowlist" "$HOME/.jarvis/render/hermes/assistentes/cliente-exemplo/config.yaml" && grep -q "unauthorized_dm_behavior: decline" "$HOME/.jarvis/render/hermes/assistentes/cliente-exemplo/config.yaml"
          ! grep -q "mcp_servers" "$HOME/.jarvis/render/hermes/assistentes/cliente-exemplo/config.yaml"
          # o Escritório do tenant de exemplo: cargo padrão + redator renderizados, rotina padrão + status-diario no catálogo
          python3 -c '
          import json
          d = json.load(open("'"$HOME"'/.jarvis/render/escritorio.json"))
          assert d["ligado"] and [c["nome"] for c in d["cargos"]] == ["trabalho", "redator"] and d["cargos"][1]["faz"], d
          assert [r["nome"] for r in d["rotinas"]] == ["resumo-da-semana", "status-diario"] and d["rotinas"][1]["onde"] == "assistente:suporte", d'
          grep -q "cargo Redator" "$HOME/.jarvis/render/hermes/cargos/redator/SOUL.md"
          # quem pensa: claude · equilibrado no dono e nos cargos; o redator (nivel: capaz) no modelo mais capaz
          grep -q "default: claude-sonnet-5-5" "$HOME/.jarvis/render/hermes/modelo.yaml"
          grep -q "default: claude-sonnet-5-5" "$HOME/.jarvis/render/hermes/cargos/trabalho/config.yaml"
          grep -q "default: claude-opus-5-5" "$HOME/.jarvis/render/hermes/cargos/redator/config.yaml"
          python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" status | python3 -c '
          import json, sys
          p = json.load(sys.stdin)["pensa"]
          assert p["provedor"] == "claude" and p["nivel"] == "equilibrado" and p["modelo"] == "claude-sonnet-5-5" and p["escolhido"], p'
          echo "{\"nivel\":\"turbo\"}" | python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" pensa-set | grep -q "\"ok\": false"
          grep -q "escritorio:" "$HOME/.jarvis/render/hermes/cargos/redator/config.yaml"
          ! grep -q "terminal" "$HOME/.jarvis/render/hermes/cargos/redator/config.yaml"
          python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" status | python3 -c '
          import json, sys
          e = json.load(sys.stdin)["escritorio"]
          assert e["ligado"] and [c["nome"] for c in e["cargos"]] == ["trabalho", "redator"], e
          r = {x["nome"]: x for x in e["rotinas"]}
          assert r["status-diario"]["quando_texto"] == "de segunda a sexta às 08:30" and r["resumo-da-semana"]["padrao"], r'
          # rotina criada pela página: vale sem colocar em uso; agenda inválida é recusada
          echo "{\"nome\":\"ping\",\"titulo\":\"Ping\",\"faz\":\"Diga oi.\",\"quando\":\"*/5 * * * *\",\"cargo\":\"redator\"}" | python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" escritorio-rotina-add | grep -q "\"ok\": true"
          echo "{\"nome\":\"ruim\",\"titulo\":\"Ruim\",\"faz\":\"x\",\"quando\":\"99 * * * *\"}" | python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" escritorio-rotina-add | grep -q "\"ok\": false"
          python3 kernel/bin/jarvis_carteiro.py --home "$HOME/.jarvis" --dry-run | grep -q "rotina ping dispararia"
          grep -q "mcp_servers" "$HOME/.jarvis/render/hermes/assistentes/suporte/config.yaml"
          printf 'valor-de-teste\n' | python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" set-secret EXEMPLO_TOKEN
          test "$(grep -c "^EXEMPLO_TOKEN='valor-de-teste'$" "$HOME/.jarvis/secrets.env")" = 1
          # só reaplica: nada instalado, serviço do JARVIS Web intocado; o segredo gravado sobrevive ao render
          ./bootstrap.sh --apply --skip hermes
          test "$(grep -c "^EXEMPLO_TOKEN='valor-de-teste'$" "$HOME/.jarvis/secrets.env")" = 1
          python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" done
          test -f "$HOME/.jarvis/setup.done"
          # atualização: consulta o GitHub (ramo da origem) e responde sem erro; nada em andamento
          python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" update-check --force | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["ok"] and d["erro"] is None and d["remoto"]["kernel"] and d["local"]["kernel"], d'
          python3 kernel/bin/jarvis_setup.py --home "$HOME/.jarvis" update-status | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["ok"] and not d["rodando"] and d["codigo"] is None, d'
      - name: verificação do papel knowledge (compose sobe o banco e desce)
        if: contains(matrix.roles, 'knowledge')
        run: |
          d="$HOME/.jarvis/compose/knowledge"
          test -f "$d/.env"
          grep -q '^POSTGRES_PASSWORD=.' "$d/.env"
          docker compose --project-directory "$d" config -q
          docker compose --project-directory "$d" up -d db
          s=starting
          for i in $(seq 1 30); do
            s=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose --project-directory "$d" ps -q db)")
            [ "$s" = healthy ] && break
            sleep 2
          done
          test "$s" = healthy
          docker compose --project-directory "$d" down -v
      - name: exportar e importar (stores jarvis, paperclip, claude; HOME alternativo)
        run: |
          . "$HOME/.jarvis/profile.sh"
          echo "dado de exemplo" > "$JARVIS_DATA/leia-me.txt"
          uv run --quiet kernel/bin/wb_export.py --dry-run
          uv run --quiet kernel/bin/wb_export.py --out "$RUNNER_TEMP/bundle.tar.gz" --only jarvis,dados,paperclip,claude
          test -f "$RUNNER_TEMP/bundle.tar.gz.sha256"
          uv run --quiet kernel/bin/wb_import.py "$RUNNER_TEMP/bundle.tar.gz" --dry-run
          uv run --quiet kernel/bin/wb_import.py "$RUNNER_TEMP/bundle.tar.gz" --jarvis-home "$RUNNER_TEMP/jarvis2" --paperclip-home "$RUNNER_TEMP/pc2" --data-home "$RUNNER_TEMP/dados2" --only jarvis,dados,paperclip
          test -f "$RUNNER_TEMP/jarvis2/jarvis.yaml"
          test -f "$RUNNER_TEMP/jarvis2/skills/exemplo-ola/SKILL.md"
          test ! -f "$RUNNER_TEMP/jarvis2/secrets.env"
          test -f "$RUNNER_TEMP/dados2/leia-me.txt"
      - name: idempotência (segunda execução)
        run: ./bootstrap.sh --tenant tenants/exemplo/jarvis.yaml --role ${{ matrix.roles }} --no-start --no-prompt --skip hermes,web
      - name: "instalador de uma linha (modo curl | sh, clona e roda o bootstrap)"
        env:
          WHITEBEARD_OS_DIR: ${{ runner.temp }}/whitebeard-os-oneline
          WHITEBEARD_OS_REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # em PR, ref_name é "N/merge" (ref interno, não é branch): usa o branch de origem
          WHITEBEARD_OS_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          cat install.sh | sh -s -- --no-start --no-prompt --skip hermes,web
          test -f "$WHITEBEARD_OS_DIR/bootstrap.sh"
          test "$(cat "$HOME/.jarvis/tenant.path")" = "$WHITEBEARD_OS_DIR/tenants/pessoal/jarvis.yaml"  # tenant padrão do install.sh
