# Manifesto de segredos do kernel. Só nomes, papéis, descrição e como obter. NUNCA valores.
# O tenant declara os seus em `segredos:` no jarvis.yaml. Variáveis usadas como ${NOME} no yaml e não
# declaradas entram em secrets.env automaticamente (não obrigatórias) para ficarem visíveis.
version: 1
secrets:
  - name: ANTHROPIC_API_KEY
    description: Chave da API Anthropic (opcional; Claude Code e Hermes também aceitam login OAuth).
    roles: [desktop, core, satelite]
    required: false
    obtain: console.anthropic.com → API keys
  - name: OPENAI_API_KEY
    description: Chave OpenAI, se o tenant usar modelos OpenAI por chave (o provedor openai-codex usa OAuth).
    roles: [desktop, core, satelite]
    required: false
    obtain: platform.openai.com → API keys
  - name: TYPESAFE_API_KEY
    description: Chave da API do Jev (TypeSafe AI), só se `decisoes.provider` for `jev`. Sem ela, a camada de decisão usa regras ou LLM.
    roles: [desktop, core, satelite]
    required: false
    obtain: console.typesafe.ai → API keys
  - name: PAPERCLIP_URL
    description: URL do Paperclip do nó core (ex. http://core.local:3100). Por máquina; não é segredo.
    roles: [desktop, satelite]
    required: false
    obtain: endereço do host core na rede local
  - name: PAPERCLIP_API_KEY
    description: Chave de API do Paperclip, usada pelo CLI e pela API REST.
    roles: [desktop, core, satelite]
    required: false
    obtain: Paperclip → Settings → API keys, no nó core
  - name: TELEGRAM_BOT_TOKEN
    description: Token do bot do Telegram do gateway Hermes. Um token = um único poller; nunca em dois hosts.
    roles: [core]
    required: true
    obtain: "@BotFather no Telegram"
  - name: TELEGRAM_HOME_CHANNEL
    description: Chat id do canal privado do dono com o bot (número, não é token).
    roles: [core]
    required: true
    obtain: id do chat, por exemplo via um bot de informação de id

# Autenticações que não cabem em variável: feitas uma vez por máquina, de forma interativa.
interactive:
  - name: claude-login
    description: O primeiro `claude` abre login OAuth da Anthropic (ou usa ANTHROPIC_API_KEY).
    roles: [desktop, core, satelite]
  - name: mcp-oauth
    description: Servidores MCP com OAuth autenticam uma vez por máquina com `/mcp` dentro do Claude Code.
    roles: [desktop, core, satelite]
  - name: hermes-provider
    description: Provedores com OAuth no Hermes (ex. openai-codex) autenticam uma vez pelo próprio Hermes.
    roles: [desktop, core, satelite]
