name: ffmpeg-whisper

# Compila o FFmpeg com o filtro Whisper (whisper.cpp) a partir do ffmpeg-build-script fixado por tag,
# e publica o binário estático como release do kernel. Manual, porque leva mais de uma hora.
# Linux x86_64 em CPU (roda em qualquer host). macOS/Metal e CUDA ficam para builds dedicados.
#
# As bibliotecas já compiladas (workspace/ e os marcadores packages/*.done) ficam em cache por tag do
# script e backend, inclusive quando o job falha: uma nova tentativa só refaz o que faltou.
# rav1e (encoder AV1 em Rust) fica desligado: o runner tem cargo, o script tenta compilá-lo e o
# configure do FFmpeg não o encontra pelo pkg-config; dav1d e SVT-AV1 já cobrem AV1.
on:
  workflow_dispatch:
    inputs:
      script_tag:
        description: "Tag do markus-perl/ffmpeg-build-script"
        default: "v9.0.4"
      backend:
        description: "Backend do whisper.cpp (cpu | vulkan)"
        default: "cpu"

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: dependências de build
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential curl tar xz-utils file python3 python3-pip python-is-python3 meson ninja-build libx11-dev libxext-dev gzip diffutils findutils >/dev/null
      - name: ffmpeg-build-script ${{ inputs.script_tag }}
        run: git clone --depth 1 --branch "${{ inputs.script_tag }}" https://github.com/markus-perl/ffmpeg-build-script.git "$RUNNER_TEMP/fbs"
      - name: restaurar bibliotecas já compiladas
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/fbs/workspace
            ${{ runner.temp }}/fbs/packages/*.done
          key: fbs-${{ inputs.script_tag }}-whisper-${{ inputs.backend }}-${{ runner.os }}-${{ runner.arch }}-v1
          restore-keys: |
            fbs-${{ inputs.script_tag }}-whisper-${{ inputs.backend }}-${{ runner.os }}-${{ runner.arch }}-
            fbs-v9.0.4-whisper-cpu-Linux-X64-v1
      - name: ajustes no script para o link estático do whisper em Linux
        working-directory: ${{ runner.temp }}/fbs
        run: |
          # 1) libggml-cpu.a usa OpenMP (GGML_OPENMP é ON com GCC) e o whisper.pc gerado não lista -lgomp
          #    nem as libs de sistema: no link estático o teste do configure falha com símbolos indefinidos.
          # 2) GGML_NATIVE=OFF: sem -march=native, o binário roda em qualquer x86_64, não só na CPU do runner.
          f=src/packages/40-audio.sh
          grep -q 'WHISPER_LIBS+=" -lstdc++"' "$f"
          sed -i 's/WHISPER_LIBS+=" -lstdc++"/WHISPER_LIBS+=" -lstdc++ -lgomp -lpthread -lm -ldl"/' "$f"
          grep -q 'DWHISPER_BUILD_TESTS=OFF' "$f"
          sed -i 's/-DWHISPER_BUILD_TESTS=OFF/-DWHISPER_BUILD_TESTS=OFF -DGGML_NATIVE=OFF/' "$f"
          grep -n 'lgomp\|GGML_NATIVE' "$f"
          rm -f packages/whisper.done   # refaz só o whisper (45 s) para o .pc sair com as libs certas
      - name: compilar (estático, LGPL, whisper=${{ inputs.backend }}, sem rav1e)
        working-directory: ${{ runner.temp }}/fbs
        run: SKIPINSTALL=yes ./build-ffmpeg --build --full-static --whisper=${{ inputs.backend }} --disable=rav1e
      - name: diagnóstico do configure (só em falha)
        if: failure()
        working-directory: ${{ runner.temp }}/fbs
        run: |
          echo "== whisper.pc"; cat workspace/lib/pkgconfig/whisper.pc 2>/dev/null || echo "(ausente)"
          echo "== pkg-config"; PKG_CONFIG_PATH=workspace/lib/pkgconfig pkg-config --static --libs --cflags whisper || true
          echo "== archives"; ls -la workspace/lib/libwhisper* workspace/lib/libggml* 2>/dev/null || true
          log=$(find packages -maxdepth 3 -path '*ffbuild/config.log' | head -n 1)
          echo "== config.log: $log"
          if [ -n "$log" ]; then awk '/check_pkg_config whisper/{f=1} f{print; n++} n>160{exit}' "$log"; fi
      - name: guardar bibliotecas compiladas (mesmo se falhou)
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/fbs/workspace
            ${{ runner.temp }}/fbs/packages/*.done
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: verificar filtro whisper e empacotar
        working-directory: ${{ runner.temp }}/fbs
        run: |
          ./workspace/bin/ffmpeg -version | head -n 1
          ./workspace/bin/ffmpeg -hide_banner -filters | grep -i whisper
          v=$(./workspace/bin/ffmpeg -version | head -n 1 | awk '{print $3}')
          name="ffmpeg-whisper-${{ inputs.backend }}-${v}-linux-x86_64"
          mkdir -p "$RUNNER_TEMP/out/$name"
          cp workspace/bin/ffmpeg workspace/bin/ffprobe "$RUNNER_TEMP/out/$name/"
          cp LICENSE "$RUNNER_TEMP/out/$name/LICENSE-build-script" 2>/dev/null || true
          tar -C "$RUNNER_TEMP/out" -cJf "$RUNNER_TEMP/out/$name.tar.xz" "$name"
          (cd "$RUNNER_TEMP/out" && sha256sum "$name.tar.xz" > "$name.tar.xz.sha256")
          echo "ASSET=$RUNNER_TEMP/out/$name.tar.xz" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          retention-days: 90
      - name: publicar como release do kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ffmpeg-whisper-${{ inputs.backend }}-linux-x86_64"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "FFmpeg com Whisper (${{ inputs.backend }}, Linux x86_64)" --notes "Build estático LGPL via ffmpeg-build-script ${{ inputs.script_tag }}, whisper.cpp backend ${{ inputs.backend }}. Verificado: filtro whisper presente."
          gh release upload "$tag" "$ASSET" "$ASSET.sha256" --clobber
